[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loss-prevention"
version = "1.0.0"
description = "Autonomous insurance loss prevention recommendation agent with uplift modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
dashboard = [
  "streamlit>=1.38",
  "plotly>=5.24",
]

[project.scripts]
loss-prevention = "loss_prevention.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/loss_prevention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Avoid clash with pytest-base-url's session-scoped base_url fixture
addopts = "-p no:base_url"

[tool.ruff]
line-length = 100
target-version = "py311"
